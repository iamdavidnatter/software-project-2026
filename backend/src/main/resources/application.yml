spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studiengang_finder}
    username: ${SPRING_DATASOURCE_USERNAME:finder}
    password: ${SPRING_DATASOURCE_PASSWORD:finder}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

app:
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
