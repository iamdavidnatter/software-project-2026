version: "3.9"

services:
  db:
    image: postgres:16
    container_name: studiengangs-finder-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studiengang_finder}
      POSTGRES_USER: ${POSTGRES_USER:-finder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finder}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: studiengangs-finder-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-studiengang_finder}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-finder}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-finder}
      APP_FRONTEND_BASE_URL: http://localhost:5173
    depends_on:
      - db
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: studiengangs-finder-frontend
    environment:
      VITE_API_BASE_URL: /api
      VITE_PROXY_TARGET: http://backend:8080
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
